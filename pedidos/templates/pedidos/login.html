<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Café · Iniciar sesión</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#E6E6FA; font-family: "Segoe UI", Arial, sans-serif; color:#6b4f8f; }
  .card { background:#fff; padding:32px; border-radius:24px; width:320px; box-shadow:0 8px 24px rgba(107,79,143,.15); }
  h1 { margin:0 0 20px; font-size:24px; }
  label { font-weight:600; font-size:14px; }
  input { width:100%; box-sizing:border-box; padding:12px; margin:6px 0 16px; border:1px solid #d9cdee; border-radius:12px; font-size:15px; }
  button { width:100%; padding:12px; border:0; border-radius:12px; background:#98FF98; color:#245c33; font-weight:700; font-size:16px; cursor:pointer; }
  .error { background:#ffe4e1; color:#a33; padding:10px; border-radius:10px; margin-bottom:14px; font-size:14px; }
</style>
</head>
<body>
<form class="card" method="post">
  {% csrf_token %}
  <h1>Campus Café</h1>
  {% if form.errors %}<div class="error">Usuario o contraseña incorrectos.</div>{% endif %}
  <label for="id_username">Usuario</label>
  {{ form.username }}
  <label for="id_password">Contraseña</label>
  {{ form.password }}
  <button type="submit">Entrar</button>
</form>
</body>
</html>
